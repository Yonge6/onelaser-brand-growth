server {
    listen 80;
    listen [::]:80;
    server_name onelaser.wonderelian.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name onelaser.wonderelian.com;

    ssl_certificate /etc/letsencrypt/live/wonderelian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wonderelian.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/wonderelian/onelaser.wonderelian.com;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json application/xml font/woff font/woff2 image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /__wonderelian_health {
        access_log off;
        default_type text/plain;
        return 200 "wonderelian-alicloud-ok\n";
    }

    location = /home { return 308 /home/; }
    location ^~ /home/assets/ {
        root /srv/wonderelian/mirrors;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /home/ {
        root /srv/wonderelian/mirrors;
        try_files $uri $uri/ /home/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /collections { return 308 /collections/; }
    location ^~ /collections/ {
        root /srv/wonderelian/mirrors;
        try_files $uri $uri/ /collections/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /xrf-gen2 { return 308 /xrf-gen2/; }
    location ^~ /xrf-gen2/assets/ {
        root /srv/wonderelian/mirrors;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /xrf-gen2/fonts/ {
        root /srv/wonderelian/mirrors;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /xrf-gen2/ {
        root /srv/wonderelian/mirrors;
        try_files $uri $uri/ /xrf-gen2/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /trade-show { return 308 /trade-show/; }
    location ^~ /trade-show/assets/ {
        root /srv/wonderelian/mirrors;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /trade-show/ {
        root /srv/wonderelian/mirrors;
        try_files $uri $uri/ /trade-show/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|mp3|m4a|aac|ogg|wav|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
